name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-cov flake8 flake8-html coverage
          pip install -r requirements.txt

      # Run tests and generate reports
      - name: Run tests and generate reports
        run: |
          pytest --cov=. --cov-report=xml --html=test-report.html
          coverage html
          mkdir -p reports
          mv htmlcov reports/coverage-report
          mv test-report.html reports/
          mkdir -p reports/flake8-report
          flake8 --format=html --htmldir=reports/flake8-report || echo "Flake8 found issues"

      # Upload test artifacts
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            reports/test-report.html
            reports/flake8-report/
            coverage.xml
            reports/coverage-report/
          retention-days: 7

      # Publish reports
      - name: Publish HTML reports
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true