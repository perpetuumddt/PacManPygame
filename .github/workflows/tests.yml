name: Tests

# Launch on push or pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
    - uses: actions/checkout@v4  # Clone repository
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html pytest-cov flake8 flake8-html
        pip install -r requirements.txt  # Installing requirements

    - name: Run pytest
      run: |
        pytest --cov=. --cov-report=xml --html=test-report.html

    - name: Run flake8
      run: |
        flake8 --format=html --htmldir=flake8-report || echo "Flake8 found issues"
      continue-on-error: true

    # Loading test results as artefacts
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3 #Using GitHub Actions
      with:
        name: test-reports-${{ github.run_id }} # Unique name
        path: |
          test-report.html
          flake8-report/
          coverage.xml
          coverage-report/
        retention-days: 7

    # Publishing reports via GitHub Pages
    - name: Publish HTML reports
      if: always()
      uses: peaceiris/actions-gh-pages@v3 #Using GitHub Pages
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Autorization
          publish_dir: ./reports # Directory for reports
          keep_files: true # Saving previous reports

    # Automatic notification
    - name: Notify PR status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          try {
            // Getting coverage.xml
            const { data: coverage } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'coverage.xml',
              ref: context.sha
            });

            // Parsing coverage persentage
            const coverageData = Buffer.from(coverage.content, 'base64').toString();
            const lineRate = coverageData.match(/line-rate="([\d.]+)"/)[1];
            const coveragePercent = Math.round(parseFloat(lineRate) * 100);

            // Creating comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              body: `### CI/CD Results ${coveragePercent >= 80 ? 'Good coverage (>80%)' : 'Bad coverage (<80%)'}\n\n` +
                    `**Tests**: [View Report](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID})\n` +
                    `**Coverage**: ${coveragePercent}% ${coveragePercent >= 80 ? 'Success(>80%)' : 'Failure (<80%)'}\n` +
                    `**Linting**: [Flake8 Report](https://${context.repo.owner}.github.io/${context.repo.repo}/flake8-report/)`
            });
          } catch (error) {
            console.error('Failed to create PR comment:', error);
          }
